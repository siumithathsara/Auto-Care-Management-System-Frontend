<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Card Part Approval - AutoCare</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../../css/common.css">
    <link rel="stylesheet" href="../../css/admin/job-card-part-manage.css">
</head>
<body class="vc-app">

<div class="container-fluid px-4 py-4">
    <!-- Header -->
    <div class="row align-items-center mb-4 g-3">
        <div class="col-12 col-md-8">
            <h3 class="fw-bold text-white mb-1">Job Card Parts Management</h3>
            <p class="text-muted mb-0 fs-7">Manage, approve, issue, and track spare part requests allocated for active job cards.</p>
        </div>
        <div class="col-12 col-md-4 text-md-end admin-only-action">
            <button class="btn btn-primary-custom px-4" onclick="loadPendingRequests()">
                <i class="fa-solid fa-clock-rotate-left me-2"></i>View Pending Requests
            </button>
        </div>
    </div>

    <!-- KPI Cards Section -->
    <div class="row g-3 mb-4">
        <div class="col-12 col-sm-6 col-xl-3">
            <div class="kpi-card">
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <span class="kpi-title">PENDING PART REQUESTS</span>
                        <h3 class="kpi-value mt-2 text-white" id="pendingRequestsCount">0</h3>
                    </div>
                    <div class="kpi-icon-box bg-primary-glow">
                        <i class="fa-solid fa-hourglass-half text-primary-color"></i>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Controls Panel (Aligned Search Inputs & Bigger Refresh Button) -->
    <div class="panel-card mb-4 p-3">
        <div class="row g-3 align-items-center">
            <!-- Universal Search Bar -->
            <div class="col-12 col-lg-6">
                <div class="custom-search-wrapper">
                    <i class="fa-solid fa-magnifying-glass search-icon"></i>
                    <input type="text" id="jobCardPartSearchInput" class="form-control custom-search-input"
                           placeholder="Search by Part Name, Code, User, or Status..." onkeyup="filterPartsLocally()">
                </div>
            </div>

            <!-- Job Card Code Search Input -->
            <div class="col-12 col-sm-8 col-lg-4">
                <div class="input-group search-by-jobcard-group w-100">
                    <input type="text" id="jobCardCodeInput" class="form-control custom-filter-input" placeholder="Enter Job Card Code...">
                    <button class="btn btn-outline-custom px-3" type="button" onclick="fetchPartsByJobCard()">
                        <i class="fa-solid fa-filter me-1"></i> Search
                    </button>
                </div>
            </div>

            <!-- Prominent Refresh Button -->
            <div class="col-12 col-sm-4 col-lg-2 text-sm-end">
                <button type="button" class="btn btn-refresh-console w-100" onclick="resetAndReload()" title="Reload All / Reset">
                    <i class="fa-solid fa-rotate me-2"></i>Refresh
                </button>
            </div>
        </div>
    </div>

    <!-- Job Card Parts Table -->
    <div class="panel-card p-0 overflow-hidden">
        <div class="table-responsive">
            <table class="table table-custom mb-0 align-middle">
                <thead>
                <tr>
                    <th>Part Details</th>
                    <th>Requested By</th>
                    <th>Quantity</th>
                    <th>Unit Price</th>
                    <th>Sub Total</th>
                    <th>Status</th>
                    <th class="text-end px-4 admin-only-action">Actions</th>
                </tr>
                </thead>
                <tbody id="jobCardPartTableBody">
                <tr>
                    <td colspan="7" class="text-center text-muted py-5 fs-7">
                        <i class="fa-solid fa-circle-notch fa-spin me-2"></i>Loading part requests...
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="../../js/admin/job-card-part-manage.js"></script>
</body>
</html>
