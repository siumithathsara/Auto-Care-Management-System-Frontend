<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Employees - AutoCare System</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

    <!-- Project Common CSS Files -->
    <link rel="stylesheet" href="../../css/common.css">
    <link rel="stylesheet" href="../../css/admin/employee-manage.css">
</head>
<body class="vc-app">

<div class="container-fluid px-4 py-4">
    <!-- Page Header -->
    <div class="row align-items-center mb-4 g-3">
        <div class="col-12 col-md-6">
            <h3 class="fw-bold text-white mb-1">Employee Management</h3>
            <p class="text-muted mb-0 fs-7">Manage system staff, designations, contact details, and records.</p>
        </div>
        <div class="col-12 col-md-6 text-md-end d-flex flex-column flex-md-row align-items-md-center justify-content-md-end gap-3">
            <!-- Role Indicator Badge -->
            <div id="roleIndicator" class="badge bg-secondary px-3 py-2">Role: Loading...</div>

            <!-- Only Visible to ADMIN via JS -->
            <button id="addEmployeeBtn" class="btn btn-primary-custom d-none" onclick="openCreateModal()">
                <i class="fa-solid fa-user-plus me-2"></i>Register New Employee
            </button>
        </div>
    </div>

    <!-- Stats & Filters Section -->
    <div class="row g-3 mb-4">
        <div class="col-12 col-sm-6 col-md-4">
            <div class="kpi-card">
                <div>
                    <div class="kpi-title">TOTAL EMPLOYEES</div>
                    <div class="kpi-value" id="totalEmployeeCount">0</div>
                </div>
                <div class="kpi-icon">
                    <i class="fa-solid fa-users-gear"></i>
                </div>
            </div>
        </div>
    </div>

    <div class="panel-card mb-4 p-3">
        <div class="row g-3 align-items-center">
            <div class="col-12 col-md-8">
                <div class="search-box position-relative">
                    <i class="fa-solid fa-magnifying-glass search-icon position-absolute top-50 start-0 translate-middle-y ms-3 text-muted"></i>
                    <input type="text" id="employeeSearchInput" class="form-control search-input-white ps-5"
                           placeholder="Search Code, Name, Designation..." onkeyup="filterEmployeesLocally()">
                </div>
            </div>
            <div class="col-12 col-md-4 text-md-end">
                <button type="button" class="btn btn-dark-panel w-100 px-4" onclick="location.reload()">
                    <i class="fa-solid fa-rotate me-2"></i>Refresh Console
                </button>
            </div>
        </div>
    </div>

    <!-- Employee Table Panel -->
    <div class="panel-card p-0 overflow-hidden">
        <div class="table-responsive">
            <table class="table table-custom mb-0 align-middle">
                <thead>
                <tr>
                    <th>Code</th>
                    <th>Employee Name</th>
                    <th>Designation</th>
                    <th>Phone Number</th>
                    <th>Address</th>
                    <th class="text-end px-4 action-col">Actions</th>
                </tr>
                </thead>
                <tbody id="employeeTableBody">
                <tr>
                    <td colspan="6" class="text-center text-muted py-5 fs-7">
                        <i class="fa-solid fa-circle-notch fa-spin me-2"></i>Loading employees...
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Employee Create / Edit Modal (Admin Only) -->
<div class="modal fade" id="employeeModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
        <div class="modal-content custom-modal" style="background: var(--bg-panel, #1e1e2d); border: 1px solid var(--border-color, #2a2a3c); color: #fff;">
            <div class="modal-header border-bottom border-secondary">
                <h5 class="modal-title fw-bold" id="modalTitle">
                    <i class="fa-solid fa-user-gear me-2 text-primary"></i>Register Employee
                </h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body py-4">
                <form id="employeeForm">
                    <input type="hidden" id="editEmployeeCode">

                    <div class="row g-3">
                        <div class="col-12 col-md-6">
                            <label class="custom-label mb-1">Employee Name *</label>
                            <input type="text" class="form-control custom-input" id="employeeName" placeholder="e.g. John Doe" required>
                        </div>

                        <div class="col-12 col-md-6">
                            <label class="custom-label mb-1">Designation *</label>
                            <input type="text" class="form-control custom-input" id="designation" placeholder="e.g. Senior Technician / Advisor" required>
                        </div>

                        <div class="col-12 col-md-6">
                            <label class="custom-label mb-1">Phone Number (10 Digits) *</label>
                            <input type="tel" class="form-control custom-input" id="phone" placeholder="0771234567" pattern="[0-9]{10}" maxlength="10" required>
                        </div>

                        <div class="col-12 col-md-6">
                            <label class="custom-label mb-1">Address</label>
                            <input type="text" class="form-control custom-input" id="address" placeholder="e.g. Colombo, Sri Lanka">
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer border-top border-secondary">
                <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary px-4" onclick="saveEmployee()">
                    <i class="fa-solid fa-floppy-disk me-2"></i>Save Record
                </button>
            </div>
        </div>
    </div>
</div>

<!-- JS Imports -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="../../js/admin/employee-manage.js"></script>
</body>
</html>
