<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Service Categories </title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../../css/common.css">
    <link rel="stylesheet" href="../../css/admin/service-category.css">
</head>
<body class="vc-app">

<div class="container-fluid px-4 py-4">
    <!-- Header -->
    <div class="row align-items-center mb-4 g-3">
        <div class="col-12 col-md-6">
            <h3 class="fw-bold text-white mb-1">Service Categories</h3>
            <p class="text-muted mb-0 fs-7">Manage system service categories and availability.</p>
        </div>
        <div class="col-12 col-md-6 text-md-end">
            <button class="btn btn-primary-custom" onclick="openCategoryModal('ADD')">
                <i class="fa-solid fa-plus me-2"></i> Add New Category
            </button>
        </div>
    </div>

    <!-- Search & Filter Panel -->
    <div class="panel-card mb-4 p-3">
        <div class="row g-3 align-items-center">
            <div class="col-12 col-md-8">
                <div class="search-box">
                    <i class="fa-solid fa-magnifying-glass search-icon"></i>
                    <input type="text" id="searchCategoryInput" class="form-control search-input-white" placeholder="Search categories by name or code..." oninput="filterCategories()">
                </div>
            </div>
            <div class="col-12 col-md-4 text-md-end">
                <button class="btn btn-dark-panel w-100 w-md-auto" onclick="loadAllCategories()">
                    <i class="fa-solid fa-rotate me-2"></i>Refresh Console
                </button>
            </div>
        </div>
    </div>

    <!-- Data Table -->
    <div class="panel-card overflow-hidden">
        <div class="table-responsive">
            <table class="table table-custom align-middle">
                <thead>
                <tr>
                    <th>Category Code</th>
                    <th>Category Name</th>
                    <th>Description</th>
                    <th>Status</th>
                    <th class="text-end">Actions</th>
                </tr>
                </thead>
                <tbody id="categoryTableBody">
                <!-- Loaded via JS -->
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Category Modal -->
<div class="modal fade" id="categoryModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content custom-modal">
            <div class="modal-header">
                <h5 class="modal-title fw-bold" id="modalTitle">Add Service Category</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="categoryForm">
                    <input type="hidden" id="editCategoryCode">
                    <input type="hidden" id="formAction">

                    <div class="mb-3">
                        <label class="custom-label">Category Name *</label>
                        <input type="text" id="catName" class="form-control custom-input" required placeholder="e.g. Engine Maintenance">
                    </div>
                    <div class="mb-4">
                        <label class="custom-label">Description</label>
                        <textarea id="catDescription" class="form-control custom-input" rows="3" placeholder="Short description about services included..."></textarea>
                    </div>

                    <div class="text-end">
                        <button type="button" class="btn btn-outline-custom me-2" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-primary-custom" id="submitBtn">Save Category</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="../../js/admin/service-category-manage.js"></script>
</body>
</html>
