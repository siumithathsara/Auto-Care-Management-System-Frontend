<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Section Management - AutoCare</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../../css/common.css">
    <link rel="stylesheet" href="../../css/job-section.css">
</head>
<body class="vc-app">

<div class="container-fluid px-4 py-4">
    <!-- Section Header -->
    <div class="row align-items-center mb-4 g-3">
        <div class="col-12 col-md-8">
            <h3 class="fw-bold text-white mb-1">Job Section Management</h3>
            <p class="text-muted mb-0 fs-7">Assign mechanics, track active sections, and transition service statuses.</p>
        </div>
        <div class="col-12 col-md-4 text-md-end">
            <button class="btn btn-primary-custom" onclick="openAssignModal()">
                <i class="fa-solid fa-plus me-2"></i>Assign Job Section
            </button>
        </div>
    </div>

    <!-- Controls Panel (Search & Status Filters) -->
    <div class="panel-card mb-4 p-3">
        <div class="row g-3 align-items-center mb-3">
            <div class="col-12 col-md-8">
                <div class="custom-search-box">
                    <i class="fa-solid fa-magnifying-glass search-icon"></i>
                    <input type="text" id="sectionSearchInput" class="form-control custom-search-input"
                           placeholder="Search by Code, Vehicle Plate, or Mechanic..." onkeyup="filterSectionsLocally()">
                </div>
            </div>
            <div class="col-12 col-md-4 text-md-end">
                <button type="button" class="btn btn-refresh-console w-100 w-md-auto" onclick="loadAllJobSections()">
                    <i class="fa-solid fa-rotate me-2"></i>Refresh Console
                </button>
            </div>
        </div>

        <!-- Status Filter Badges -->
        <div class="d-flex align-items-center gap-2 flex-wrap" id="statusFilterContainer">
            <button class="btn btn-outline-custom active-filter px-3 py-1 fs-8" onclick="filterByStatus('ALL', this)">ALL</button>
            <button class="btn btn-outline-custom px-3 py-1 fs-8 text-warning" onclick="filterByStatus('PENDING', this)">PENDING</button>
            <button class="btn btn-outline-custom px-3 py-1 fs-8 text-info" onclick="filterByStatus('IN_PROGRESS', this)">IN PROGRESS</button>
            <button class="btn btn-outline-custom px-3 py-1 fs-8 text-success" onclick="filterByStatus('COMPLETED', this)">COMPLETED</button>
        </div>
    </div>

    <!-- Main Table Panel -->
    <div class="panel-card p-0 overflow-hidden">
        <div class="table-responsive">
            <table class="table table-custom mb-0 align-middle">
                <thead>
                <tr>
                    <th>Section Code</th>
                    <th>Job Card</th>
                    <th>Vehicle</th>
                    <th>Section Name</th>
                    <th>Mechanic</th>
                    <th>Status</th>
                    <th>Started / Completed</th>
                    <th class="text-end px-4">Actions</th>
                </tr>
                </thead>
                <tbody id="jobSectionsTableBody">
                <tr>
                    <td colspan="8" class="text-center text-muted py-5 fs-7">
                        <i class="fa-solid fa-circle-notch fa-spin me-2"></i>Loading job sections...
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Modal: Assign Job Section (POST /assign) -->
<div class="modal fade" id="assignSectionModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content custom-modal">
            <div class="modal-header">
                <h5 class="modal-title fw-bold text-white"><i class="fa-solid fa-screwdriver-wrench me-2 text-primary-color"></i>Assign Job Section</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body py-4">
                <form id="assignSectionForm">
                    <div class="mb-3">
                        <label class="form-label">JOB CARD CODE *</label>
                        <select id="jobCardCodeSelect" class="form-select custom-search-input" required>
                            <option value="" selected disabled>Select In-Progress Job Card</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="custom-label">Assigned By User ID *</label>
                        <input type="number" class="form-control custom-input" id="assignUserId" placeholder="e.g. 1" required>
                    </div>
                    <div class="mb-3">
                        <label class="custom-label">Mechanic Employee ID *</label>
                        <input type="number" class="form-control custom-input" id="assignMechanicId" placeholder="e.g. 5" required>
                    </div>
                    <div class="mb-3">
                        <select class="form-select custom-input" id="assignSectionName" required>
                            <option value="" selected disabled>Select Section</option>
                            <option value="WASHING_SECTION">Washing Section</option>
                            <option value="INTERIOR_SECTION">Interior Section</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="custom-label">Remarks</label>
                        <textarea class="form-control custom-input" id="assignRemarks" rows="2" placeholder="Initial notes for mechanic..."></textarea>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline-custom" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary-custom px-4" onclick="submitAssignSection()">
                    <i class="fa-solid fa-paper-plane me-2"></i>Assign Section
                </button>
            </div>
        </div>
    </div>
</div>

<!-- Modal: Complete Section with Remarks (PUT /complete/{code}) -->
<div class="modal fade" id="completeSectionModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content custom-modal">
            <div class="modal-header">
                <h5 class="modal-title fw-bold text-white"><i class="fa-solid fa-circle-check me-2 text-success"></i>Complete Job Section</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body py-4">
                <input type="hidden" id="completeTargetCode">
                <div class="mb-3">
                    <label class="custom-label">Completion Remarks</label>
                    <textarea class="form-control custom-input" id="completeRemarks" rows="3" placeholder="Enter work summary or diagnostic findings..."></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline-custom" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-success px-4 fw-bold" onclick="submitCompleteSection()">
                    <i class="fa-solid fa-check me-2"></i>Mark Completed
                </button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="../../js/admin/job-section-manage.js"></script>
</body>
</html>
