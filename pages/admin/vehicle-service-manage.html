<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vehicle Services Management - Admin Panel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../../css/common.css">
    <link rel="stylesheet" href="../../css/service.css">
</head>
<body class="vc-app">

<div class="container-fluid px-4 py-4">
    <!-- Header with Counter KPI -->
    <div class="row align-items-center mb-4 g-3">
        <div class="col-12 col-md-6">
            <h3 class="fw-bold text-white mb-1">Vehicle Services</h3>
            <p class="text-muted mb-0 fs-7">Manage system services, fees, duration, and categories.</p>
        </div>
        <div class="col-12 col-md-6 text-md-end d-flex justify-content-md-end gap-3 align-items-center">
            <div class="panel-card px-3 py-2 d-inline-flex align-items-center gap-2">
                <span class="text-muted fs-8 fw-bold">TOTAL SERVICES:</span>
                <span id="totalServicesBadge" class="fw-bold text-white fs-6">0</span>
            </div>
            <button class="btn btn-primary-custom" onclick="openServiceModal('ADD')">
                <i class="fa-solid fa-plus me-2"></i> Add New Service
            </button>
        </div>
    </div>

    <!-- Search & Filter Panel -->
    <div class="panel-card mb-4 p-3">
        <div class="row g-3 align-items-center">
            <div class="col-12 col-md-8">
                <div class="search-box">
                    <i class="fa-solid fa-magnifying-glass search-icon"></i>
                    <input type="text" id="searchServiceInput" class="form-control search-input-white" placeholder="Search services by name or code..." oninput="filterServices()">
                </div>
            </div>
            <div class="col-12 col-md-4">
                <select id="adminCategoryFilter" class="form-select custom-input" onchange="filterServices()">
                    <option value="ALL">All Categories</option>
                </select>
            </div>
        </div>
    </div>

    <!-- Data Table -->
    <div class="panel-card overflow-hidden">
        <div class="table-responsive">
            <table class="table table-custom align-middle">
                <thead>
                <tr>
                    <th>Service Code</th>
                    <th>Service Name</th>
                    <th>Category</th>
                    <th>Standard Fee (LKR)</th>
                    <th>Est. Time</th>
                    <th>Status</th>
                    <th class="text-end">Actions</th>
                </tr>
                </thead>
                <tbody id="serviceTableBody">
                <!-- Loaded via JS -->
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Modal -->
<div class="modal fade" id="serviceModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content custom-modal">
            <div class="modal-header">
                <h5 class="modal-title fw-bold" id="modalTitle">Add Vehicle Service</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="serviceForm">
                    <input type="hidden" id="editServiceCode">
                    <input type="hidden" id="formAction">

                    <div class="mb-3">
                        <label class="custom-label">Category *</label>
                        <select id="sCategoryCode" class="form-select custom-input" required></select>
                    </div>

                    <div class="mb-3">
                        <label class="custom-label">Service Name *</label>
                        <input type="text" id="sServiceName" class="form-control custom-input" required placeholder="e.g. Full Synthetic Oil Service">
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-6">
                            <label class="custom-label">Standard Fee (LKR) *</label>
                            <input type="number" step="0.01" id="sStandardFee" class="form-control custom-input" required placeholder="8500.00">
                        </div>
                        <div class="col-6">
                            <label class="custom-label">Est. Time (Mins) *</label>
                            <input type="number" id="sEstimatedTimeMins" class="form-control custom-input" required placeholder="45">
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="custom-label">Description</label>
                        <textarea id="sDescription" class="form-control custom-input" rows="3" placeholder="Overview of tasks included in this service..."></textarea>
                    </div>

                    <div class="text-end">
                        <button type="button" class="btn btn-outline-custom me-2" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-primary-custom">Save Service</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="../../js/admin/vehicle-service-manage.js"></script>
</body>
</html>
