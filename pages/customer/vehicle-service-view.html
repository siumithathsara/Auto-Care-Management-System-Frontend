<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vehicle Services Catalog - AutoCare</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../../css/common.css">
    <link rel="stylesheet" href="../../css/service.css">
</head>
<body class="vc-app">

<div class="container-fluid px-4 py-4">
    <!-- Header -->
    <div class="row align-items-center mb-4 g-3">
        <div class="col-12 col-md-8">
            <h3 class="fw-bold text-white mb-1" id="servicePageTitle">Available Vehicle Services</h3>
            <p class="text-muted mb-0 fs-7" id="servicePageSubtitle">Browse our full catalog of professional vehicle repair & maintenance services.</p>
        </div>
        <div class="col-12 col-md-4 text-md-end">
            <a href="service-category-view.html" class="btn btn-outline-custom btn-sm">
                <i class="fa-solid fa-arrow-left me-2"></i>Back to Categories
            </a>
        </div>
    </div>


    <!-- Filter Bar -->
    <div class="panel-card mb-4 p-3">
        <div class="row g-3">
            <div class="col-12 col-md-8">
                <div class="search-box">
                    <i class="fa-solid fa-magnifying-glass search-icon"></i>
                    <input type="text" id="custSearchInput" class="form-control search-input-white" placeholder="Search services..." oninput="filterCustomerServices()">
                </div>
            </div>
            <div class="col-12 col-md-4">
                <select id="custCategoryFilterSelect" class="form-select custom-input" onchange="onCategoryFilterChange()">
                    <option value="ALL">All Service Categories</option>
                </select>
            </div>
        </div>
    </div>

    <!-- Responsive Cards Grid -->
    <div class="row g-4" id="customerServicesGrid">
        <!-- Rendered via JS -->
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="../../js/customer/vehicle-service-view.js"></script>
</body>
</html>
