<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explore Service Categories - AutoCare</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../../css/common.css">
    <link rel="stylesheet" href="../../css/customer/service-category.css">
</head>
<body class="vc-app">

<div class="container-fluid px-4 py-4">
    <!-- Header -->
    <div class="row align-items-center mb-4">
        <div class="col-12 col-md-8">
            <h3 class="fw-bold text-white mb-1">Service Categories</h3>
            <p class="text-muted mb-0 fs-7">Explore our professional auto repair and maintenance specialized categories.</p>
        </div>
    </div>

    <!-- Search Bar -->
    <div class="panel-card mb-4 p-3">
        <div class="search-box">
            <i class="fa-solid fa-magnifying-glass search-icon"></i>
            <input type="text" id="customerSearchInput" class="form-control search-input-white" placeholder="Search service categories (e.g. Wash, Engine, Hybrid)..." oninput="filterCustomerCategories()">
        </div>
    </div>

    <!-- Categories Grid -->
    <div class="row g-4" id="customerCategoryGrid">
        <!-- Dynamically Rendered Cards -->
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="../../js/customer/service-category-view.js"></script>
</body>
</html>
