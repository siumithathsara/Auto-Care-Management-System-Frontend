<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer - My Invoices</title>

    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

    <link rel="stylesheet" href="../../css/invoice-theme.css">
</head>
<body class="vc-app">

<div class="container-fluid px-3 px-md-4 py-4">

    <!-- Header -->
    <div class="row align-items-center mb-4 g-3">
        <div class="col-12 col-md-8">
            <h3 class="fw-bold text-white mb-1">My Invoices</h3>
            <p class="text-muted mb-0 fs-7">Track your service billing statements, payments, and balances.</p>
        </div>
        <div class="col-12 col-md-4 text-md-end">
            <button class="btn btn-dark-panel w-100 w-md-auto px-4" onclick="loadCustomerInvoices()">
                <i class="fa-solid fa-rotate me-2"></i>Refresh List
            </button>
        </div>
    </div>

    <!-- Summary KPI Cards -->
    <div class="row g-3 mb-4">
        <div class="col-12 col-sm-6 col-md-4">
            <div class="kpi-card">
                <div>
                    <span class="kpi-title">MY TOTAL BILLS</span>
                    <h2 class="kpi-value" id="custKpiTotal">0</h2>
                </div>
                <div class="kpi-icon"><i class="fa-solid fa-receipt"></i></div>
            </div>
        </div>
        <div class="col-12 col-sm-6 col-md-4">
            <div class="kpi-card">
                <div>
                    <span class="kpi-title">FULLY PAID</span>
                    <h2 class="kpi-value text-emerald" id="custKpiPaid">0</h2>
                </div>
                <div class="kpi-icon text-emerald bg-emerald-glow"><i class="fa-solid fa-circle-check"></i></div>
            </div>
        </div>
        <div class="col-12 col-sm-12 col-md-4">
            <div class="kpi-card">
                <div>
                    <span class="kpi-title">PENDING BALANCES</span>
                    <h2 class="kpi-value text-warning" id="custKpiPending">0</h2>
                </div>
                <div class="kpi-icon text-warning bg-warning-glow"><i class="fa-solid fa-triangle-exclamation"></i></div>
            </div>
        </div>
    </div>

    <!-- Table Container -->
    <div class="panel-card overflow-hidden p-0">
        <div class="table-responsive">
            <table class="table table-custom align-middle mb-0">
                <thead>
                <tr>
                    <th>Invoice Code</th>
                    <th>Job Card</th>
                    <th>Vehicle Details</th>
                    <th>Total Bill</th>
                    <th>Paid Amount</th>
                    <th>Balance Due</th>
                    <th>Status</th>
                    <th>Issued Date</th>
                    <th class="text-end">Details</th>
                </tr>
                </thead>
                <tbody id="customerInvoiceTableBody">
                <tr>
                    <td colspan="9" class="text-center text-muted py-5 fs-7">
                        <i class="fa-solid fa-circle-notch fa-spin me-2 text-primary-color"></i>Loading your invoice history...
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Modal: View Customer Details -->
<div class="modal fade" id="customerViewModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-md modal-dialog-centered">
        <div class="modal-content custom-modal">
            <div class="modal-header border-0 pb-0">
                <h5 class="modal-title fw-bold text-white" id="customerModalTitle">Invoice Statement</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body pt-3" id="customerModalBody"></div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="../../js/customer/invoice-tracker.js"></script>
</body>
</html>
