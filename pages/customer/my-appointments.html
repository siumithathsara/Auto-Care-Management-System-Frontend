<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Appointments - AutoCare</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../../css/common.css">
    <link rel="stylesheet" href="../../css/appointment.css">
</head>
<body class="vc-app">

<div class="container-fluid px-4 py-4">
    <div class="row align-items-center mb-4 g-3">
        <div class="col-12 col-md-8">
            <h3 class="fw-bold text-white mb-1">My Bookings</h3>
            <p class="text-muted mb-0 fs-7">Track your vehicle service schedules and current progress.</p>
        </div>
        <div class="col-12 col-md-4 text-md-end">
            <a href="appointment-booking.html" class="btn btn-primary-custom">
                <i class="fa-solid fa-plus me-2"></i>New Appointment
            </a>
        </div>
    </div>

    <div class="panel-card overflow-hidden">
        <div class="table-responsive">
            <table class="table table-custom align-middle">
                <thead>
                <tr>
                    <th>CODE</th>
                    <th>VEHICLE</th>
                    <th>DATE & TIME</th>
                    <th>SERVICES</th>
                    <th>EST. FEE</th>
                    <th>STATUS</th>
                    <th class="text-end">ACTION</th>
                </tr>
                </thead>
                <tbody id="myAppointmentsBody"></tbody>
            </table>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="../../js/customer/my-appointments.js"></script>
</body>
</html>
